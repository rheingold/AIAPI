        // Variables and template literals
        var greeting = "Hello, World!";
        var path = "C:\\Users\\test\\Documents";
        var url = "https://example.com/api?key=value&foo=bar";
        
        // Template literals with embedded expressions
        var template = `Hello ${greeting}, path is ${path}`;

        var html = '<div class="test">Content & more</div>';
        var json = '{"key": "value with \"quotes\""}';
        
        // Regular expressions
        var re = /\b[A-Z]{2,}\b/g;
        
        // Functions with parameters
        function process(input, output = "default") {
            console.log(`Input: ${input}, Output: ${output}`);
            return input.toUpperCase();
        }
        
        // Event handlers with inline strings
        document.addEventListener('click', function(e) {
            console.log("Clicked: " + e.target.id);
        });
        
        // Fetch with headers
        fetch(url, {
            method: 'POST',
            headers: {

            body: JSON.stringify({query: "test", filter: {active: true}})

    <!-- Embedded PowerShell command -->
    <pre id="ps-command">
powershell.exe -Command "& { $var = 'hello'; Write-Host `$var }"
    </pre>
    
    <!-- Embedded batch command -->

@echo off & set "PATH=C:\Program Files\app" & echo %PATH%
    </pre>
